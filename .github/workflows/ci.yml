name: arnold first workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t doordash/delivery-fee-service .

      - name: Run Docker image
        run: docker run -d -p 8080:8080 doordash/delivery-fee-service

      - name: Start FastAPI server
        run: |
          echo "Waiting for API to be ready on http://localhost:8080 ..."
          for i in {1..10}; do
            if curl -sSf http://localhost:8080/status/ > /dev/null; then
              echo "API is up ✅"
              exit 0
            fi
            echo "API not ready yet, retrying in 3s..."
            sleep 3
          done
          echo "API failed to start ❌"
          docker logs fee-service || true
          exit 1

      - name: Test GET /
        run: curl -f http://localhost:8000/  || exit 1

      - name: Test POST /calculate-fee/
        run: |
         curl -f -X POST http://localhost:8000/calculate-fee/ \
            -H "Content-Type: application/json" \
            -d '{"distance_km": 5.0, "weight_kg": 2.0}'  || exit 1

      - name: Test GET /estimate-time/
        run: curl -f http://localhost:8000/estimate-time/10  || exit 1

      - name: Test GET /status/
        run: curl -f http://localhost:8000/status/  || exit 1

      - name: Stop and remove container
        if: always()
        run: |
          docker stop doordash/delivery-fee-service
          docker rm doordash/delivery-fee-service
          docker ps -a



